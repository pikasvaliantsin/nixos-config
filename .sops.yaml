# .sops.yaml — конфигурация для шифрования секретов
#
# ────────────────────────────────────────────────────────────────────────────
# КАК ПОЛУЧИТЬ AGE-КЛЮЧ ИЗ SSH-КЛЮЧА ХОСТА:
#
#   ssh-keygen -y -f /etc/ssh/ssh_host_ed25519_key | ssh-to-age
#
# ВАРИАНТ Б — ЛИЧНЫЙ AGE-КЛЮЧ (не зависит от хоста):
#
#   nix shell nixpkgs#age -c age-keygen -o ~/.config/sops/age/keys.txt
#   cat ~/.config/sops/age/keys.txt   # покажет публичный key: age1...
#
#   Затем добавь этот ключ ВМЕСТЕ с хостовым, через запятую:
#     age: age1host...,age1personal...
# ────────────────────────────────────────────────────────────────────────────

creation_rules:
  - path_regex: secrets/secrets\.yaml$
    # AGE-ключи: хостовый SSH-ключ (обязательно) + личный master key (опционально)
    # Разделяются запятой. sops-init подставляет их автоматически.
    age: age1ps03aszfl65ny2rm8mn3xjguf78t7lr5t0w06x2p7vzrmchc3auqv9ypcl,age1h0rwmg0d4g5d93m7p5zwm26hgeucnfjecyhxc5e6wklnwawpxpasvucgxm
